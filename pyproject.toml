[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "savitsky"
version = "0.1.0"
description = "Savitsky (1964) planing hull hydrodynamics model for PEP27 boat design"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "openplaning",
    "setuptools<81",
]

[tool.setuptools.packages.find]
where = ["src"]
